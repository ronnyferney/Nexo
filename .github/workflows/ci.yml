name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  # La publicación de versiones (release.yml) reutiliza estas mismas puertas de calidad.
  workflow_call:
    inputs:
      ref:
        description: Commit o etiqueta a validar (por defecto, el del evento)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U nexo" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexo:nexo@localhost:5432/nexo?schema=public
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      # Las migraciones se aplican tal como en producción (incluye el SQL manual de búsqueda full-text).
      - run: npx prisma migrate deploy
      - run: npm run test:e2e

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/release.test.mjs
      - run: node scripts/release.mjs current

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build
      # M7: el piloto solo se sintetiza con dominio y certificado (aquí, una zona ficticia: synth no consulta AWS).
      - run: >-
          npx cdk synth --quiet -c imageTag=0.0.0-ci -c domainName=nexo.example.com
          -c hostedZoneId=Z0000000000000000000 -c hostedZoneName=example.com
      - name: Sin dominio ni modo de pruebas, la síntesis del piloto debe fallar
        run: |
          if npx cdk synth NexoPilot --quiet -c imageTag=0.0.0-ci -o "$RUNNER_TEMP/cdk-sin-tls" > "$RUNNER_TEMP/sin-tls.log" 2>&1; then
            cat "$RUNNER_TEMP/sin-tls.log"; echo "::error::El piloto se sintetizó por HTTP sin allowInsecureHttp"; exit 1
          fi
          grep -q "no se publica por HTTP en claro" "$RUNNER_TEMP/sin-tls.log"
          # Los otros stacks no dependen del dominio (cdk deploy NexoRegistry/NexoGithubOidc en el paso 1 de la guía).
          npx cdk synth NexoRegistry --quiet -o "$RUNNER_TEMP/cdk-registry"

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/edge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/edge/package-lock.json
      # El núcleo SQL del Edge es una copia del de la API: deben ser idénticos.
      - run: npm run check:core
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -t nexo/edge:ci .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  # P5: pruebas unitarias de la web (Karma + Jasmine en Chrome sin interfaz; el runner trae Chrome instalado).
  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:ci
