name: Desplegar piloto AWS

# Despliegue manual del piloto (ECS Fargate + RDS + ElastiCache) con AWS CDK.
# Autenticación por OIDC: sin llaves de AWS en GitHub. Requisitos (una sola vez, ver docs/deploy-aws.md):
#   - cdk bootstrap en la cuenta/región
#   - stack NexoGithubOidc desplegado y su salida guardada como secreto AWS_DEPLOY_ROLE_ARN
#   - variable AWS_REGION (y opcionalmente DOMAIN_NAME, HOSTED_ZONE_ID, HOSTED_ZONE_NAME)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escriba "desplegar" para confirmar'
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-pilot
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'desplegar' }}
    runs-on: ubuntu-latest
    environment: piloto
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: npm ci
      - run: npm run build
      - name: Desplegar
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
        run: npx cdk deploy NexoPilot --require-approval never --outputs-file outputs.json
      - name: Resumen
        run: |
          echo "### Piloto de Nexo desplegado" >> $GITHUB_STEP_SUMMARY
          node -e "const o=require('./outputs.json').NexoPilot; console.log('- URL: '+o.Url+'\n- Secreto de la app: '+o.AppSecretArn)" >> $GITHUB_STEP_SUMMARY
