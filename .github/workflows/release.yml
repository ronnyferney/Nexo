name: Publicar versión

# Publica una versión inmutable de Nexo a partir de una etiqueta vX.Y.Z:
#   1. Verifica que todas las versiones del monorepo coinciden con la etiqueta y que el CHANGELOG la documenta.
#   2. Ejecuta las mismas puertas de calidad del CI (tipos, lint, unitarias, E2E, build, Edge, infraestructura).
#   3. Construye una sola vez las imágenes api, web y edge y las publica en GHCR con SBOM y procedencia.
#   4. Crea el GitHub Release con las notas del CHANGELOG y los digests de las imágenes.
# El despliegue (deploy-aws.yml) usa exactamente estas imágenes: nunca reconstruye.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_call:
    inputs:
      tag:
        description: Etiqueta a publicar (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      registry: ${{ steps.v.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: v
        run: |
          node scripts/release.mjs check "$TAG"
          node scripts/release.mjs notes "$TAG" > /dev/null
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  quality:
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  images:
    needs: [verify, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        app: [api, web, edge]
    outputs:
      api: ${{ steps.digest.outputs.api }}
      web: ${{ steps.digest.outputs.web }}
      edge: ${{ steps.digest.outputs.edge }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadatos
        id: meta
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Construir y publicar nexo-${{ matrix.app }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            APP_VERSION=${{ needs.verify.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: ${{ needs.verify.outputs.registry }}/nexo-${{ matrix.app }}:${{ needs.verify.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - id: digest
        run: echo "${{ matrix.app }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  github-release:
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Notas de la versión
        env:
          REGISTRY: ${{ needs.verify.outputs.registry }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release.mjs notes "$TAG" > notes.md
          {
            echo
            echo "### Imágenes"
            echo
            echo "| Imagen | Digest |"
            echo "|---|---|"
            echo "| \`$REGISTRY/nexo-api:$VERSION\` | \`${{ needs.images.outputs.api }}\` |"
            echo "| \`$REGISTRY/nexo-web:$VERSION\` | \`${{ needs.images.outputs.web }}\` |"
            echo "| \`$REGISTRY/nexo-edge:$VERSION\` | \`${{ needs.images.outputs.edge }}\` |"
            echo
            echo "Desplegar: Actions → **Desplegar piloto AWS** → versión \`$VERSION\`."
          } >> notes.md
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "Nexo $TAG" --notes-file notes.md
