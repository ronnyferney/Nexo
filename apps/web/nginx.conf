# WebSocket (Nexo Edge): reenviar el encabezado Upgrade solo cuando el cliente lo pide.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

# HSTS solo cuando el proxy delante (ALB) recibió la petición por https; vacío = nginx no envía la cabecera.
map $http_x_forwarded_proto $nexo_hsts {
  default '';
  https   'max-age=31536000';
}

# Registro de accesos sin credenciales en la URL (B1/C1): tokens de webhooks, invitaciones y verificación de correo, y
# la query (code/state) de los callbacks OAuth.
map $request_uri $nexo_log_uri {
  ~^(?<tp>/api/(?:hooks|auth/invitations|auth/verify-email)/)(?!request(?:[/?]|$))[^/?]+(?<tr>[^?]*)  $tp[REDACTADO]$tr;
  ~^(?<sp>/(?:invitacion|verificar-correo)/)[^/?]+                                                   $sp[REDACTADO];
  ~^(?<cp>/api/[^?]*callback)\?                                                                       $cp?[REDACTADO];
  default                                                                                            $request_uri;
}
log_format nexo_redacted '$remote_addr - $remote_user [$time_local] "$request_method $nexo_log_uri $server_protocol" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

server {
  listen 80;
  access_log /var/log/nginx/access.log nexo_redacted;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # API, webhooks y servidor MCP
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Streaming SSE (chat de agentes y MCP)
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 10m;
  }

  location ~* \.(js|css|svg|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/nexo-security-headers.conf;
  }

  location = /version.json {
    add_header Cache-Control "no-store";
    include /etc/nginx/snippets/nexo-security-headers.conf;
  }

  # SPA
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/nexo-security-headers.conf;
  }
}
