# Cabeceras de seguridad de la web (auditoría M6). Se incluye en cada `location` que sirve la SPA o sus archivos: en
# nginx, un `add_header` dentro de una location anula los heredados del server, y /api/ no las lleva (la API envía
# las suyas con helmet; duplicar la CSP las combinaría).
#
# CSP, directiva por directiva:
# - script-src 'self': solo los bundles de Angular (sin eval ni scripts en línea). El hash con 'unsafe-hashes'
#   autoriza únicamente el manejador onload="this.media='all'" que el build de producción agrega al <link> de
#   styles.css al incrustar el CSS crítico; si Angular lo cambia, recalcule el hash o desactive inlineCritical.
# - style-src 'unsafe-inline': Angular inyecta los estilos de los componentes en <style> y el build incrusta el CSS
#   crítico y las @font-face; fonts.googleapis.com por si la incrustación de fuentes no está disponible (ng serve).
# - font-src: Inter y JetBrains Mono desde fonts.gstatic.com. img-src: recursos propios, data: y blob:.
# - connect-src 'self': la API va por /api en el mismo origen (fetch con SSE incluido).
# - frame-ancestors 'none' (y X-Frame-Options DENY): nadie puede incrustar la web (clickjacking).
# - Sin upgrade-insecure-requests: docker compose sirve por http en localhost.
# Sin Cross-Origin-Opener-Policy: la ventana emergente del inicio de sesión OAuth avisa a la principal con
# window.opener.postMessage, que COOP same-origin cortaría.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# HSTS solo si la petición llegó por https (TLS en el ALB o en un proxy delante): por http el navegador la ignora y
# en localhost no debe fijarse. Sin includeSubDomains para no afectar a otros subdominios del cliente.
add_header Strict-Transport-Security $nexo_hsts always;
