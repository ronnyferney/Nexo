# Nexo — entorno completo: docker compose up -d --build
# Antes: cp .env.example .env y complete JWT_SECRET, ENCRYPTION_KEY y ANTHROPIC_API_KEY.
x-api-env: &api-env
  DATABASE_URL: postgresql://nexo:${POSTGRES_PASSWORD:-nexo}@postgres:5432/nexo?schema=public
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY en .env}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  EXECUTIONS_RETENTION_DAYS: ${EXECUTIONS_RETENTION_DAYS:-30}
  COPILOT_PROVIDER: ${COPILOT_PROVIDER:-anthropic}
  COPILOT_MODEL: ${COPILOT_MODEL:-claude-opus-5-5}
  COPILOT_MONTHLY_QUOTA_USD: ${COPILOT_MONTHLY_QUOTA_USD:-2}
  PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
  BOOTSTRAP_WORKSPACE_NAME: ${BOOTSTRAP_WORKSPACE_NAME:-}
  # La web (nginx :8080) sirve la interfaz y reenvía /api: callbacks OAuth y Nexo Edge usan la misma URL pública.
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
  WEB_URL: ${WEB_URL:-http://localhost:8080}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-opus-5-5}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  CONNECTOR_TIMEOUT_MS: ${CONNECTOR_TIMEOUT_MS:-30000}
  CONNECTOR_ALLOW_PRIVATE_NETWORKS: ${CONNECTOR_ALLOW_PRIVATE_NETWORKS:-false}
  OAUTH_HUBSPOT_CLIENT_ID: ${OAUTH_HUBSPOT_CLIENT_ID:-}
  OAUTH_HUBSPOT_CLIENT_SECRET: ${OAUTH_HUBSPOT_CLIENT_SECRET:-}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
  OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
  OAUTH_SALESFORCE_CLIENT_ID: ${OAUTH_SALESFORCE_CLIENT_ID:-}
  OAUTH_SALESFORCE_CLIENT_SECRET: ${OAUTH_SALESFORCE_CLIENT_SECRET:-}
  OAUTH_LINKEDIN_CLIENT_ID: ${OAUTH_LINKEDIN_CLIENT_ID:-}
  OAUTH_LINKEDIN_CLIENT_SECRET: ${OAUTH_LINKEDIN_CLIENT_SECRET:-}
  OAUTH_SLACK_CLIENT_ID: ${OAUTH_SLACK_CLIENT_ID:-}
  OAUTH_SLACK_CLIENT_SECRET: ${OAUTH_SLACK_CLIENT_SECRET:-}
  NODE_ENV: production

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexo}
      POSTGRES_DB: nexo
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexo"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # API HTTP (sin worker: escala por réplicas detrás de un balanceador)
  api:
    build: ./apps/api
    environment:
      <<: *api-env
      WORKER_ENABLED: "false"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["3000:3000"]

  # Workers de flujos (escale con: docker compose up -d --scale worker=3)
  worker:
    build: ./apps/api
    environment:
      <<: *api-env
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: 10
    depends_on:
      api: { condition: service_started }

  web:
    build: ./apps/web
    depends_on: [api]
    ports: ["8080:80"]

  # Nexo Edge (ADR 0005): agente on-premise de ejemplo. Normalmente corre en la red del CLIENTE, no junto a la API.
  # Para probarlo en local: registre un Edge en Administración → Nexo Edge, copie apps/edge/edge.example.yaml como
  # apps/edge/edge.yaml, descomente el servicio y ejecute: NEXO_EDGE_TOKEN=nexoedge_... docker compose --profile edge up -d edge
  # edge:
  #   build: ./apps/edge
  #   profiles: [edge]
  #   environment:
  #     NEXO_URL: http://api:3000
  #     NEXO_EDGE_TOKEN: ${NEXO_EDGE_TOKEN:?Defina NEXO_EDGE_TOKEN}
  #     EDGE_ALLOW_INSECURE: "true"   # solo en esta red interna de Compose; en producción use https://
  #   volumes:
  #     - ./apps/edge/edge.yaml:/app/edge.yaml:ro
  #   depends_on: [api]

volumes:
  pgdata:
  redisdata:
